name: SafeBite CI

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  testes-web:
    name: Validar dashboard web
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar arquivos JavaScript
        run: |
          node --check FRONTEND/View/Dashboard/js/dados.js
          node --check FRONTEND/View/Dashboard/js/app.js
          node --check FRONTEND/View/Dashboard/js/embed.js

      - name: Executar testes SafeBite web
        run: node --test FRONTEND/tests/safebite.test.cjs

      - name: Gerar artefato do frontend
        uses: actions/upload-artifact@v4
        with:
          name: safebite-frontend
          path: FRONTEND/View/
          if-no-files-found: error

  testes-mobile:
    name: Validar dashboard mobile (Expo)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Mobile

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js e cache npm
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Mobile/package-lock.json

      - name: Instalar dependencias travadas
        run: npm ci --no-audit --no-fund

      - name: Testar base e calculos do dashboard
        run: npm run test:dashboard